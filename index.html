<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바이러스 에이전트 기반 확산 시뮬레이션</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; font-size: 24px; }
        .dashboard { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; background: #ecf0f1; padding: 15px; border-radius: 8px; }
        .control-group { flex: 1 1 45%; display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input[type="range"], input[type="number"] { width: 100%; margin-bottom: 10px; }
        .summary { text-align: center; margin-top: 20px; padding: 15px; background: #e74c3c; color: white; border-radius: 8px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-around;}
        canvas { max-width: 100%; margin-top: 20px; display: block; margin-left: auto; margin-right: auto;}
        #simCanvas { border: 2px solid #ccc; background-color: #fafafa; }
        .status-box { flex: 1; text-align: center; margin: 0 10px;}
    </style>
</head>
<body>

<div class="container">
    <h1>🔬 바이러스 에이전트 기반 확산 시뮬레이션</h1>
    
    <div class="dashboard">
        <div class="control-group">
            <label>전체 인구수 (명): <span id="val-pop">300</span></label>
            <input type="number" id="total-pop" value="300" min="100" max="2000" step="100">
            
            <label>초기 감염자 수 (명): <span id="val-init-inf">1</span> (고정)</label>
            <input type="number" id="init-inf" value="1" readonly style="background-color: #ddd;">
            
            <label>회복/사망까지 걸리는 시간 (프레임 단위): <span id="val-recovery">300</span></label>
            <input type="range" id="recovery" value="300" min="100" max="1000" step="50">
        </div>
        
        <div class="control-group">
            <label>바이러스 치사율 (%): <span id="val-fatality">5</span>%</label>
            <input type="range" id="fatality" value="5" min="0" max="100" step="1">

            <label>에이전트 이동 속도: <span id="val-speed">2</span></label>
            <input type="range" id="speed" value="2" min="1" max="5" step="1">

            <label>감염 반경 (px): <span id="val-infection-radius">10</span></label>
            <input type="range" id="infection-radius" value="10" min="5" max="30" step="1">
        </div>
        <div style="width: 100%; text-align: center; margin-top: 10px;">
          <button id="start-btn" style="padding: 10px 20px; font-size: 16px;">시뮬레이션 시작 / 재설정</button>
        </div>
    </div>

    <div class="summary">
        <div class="status-box">현재 감염자: <span id="current-infected">0</span>명</div>
        <div class="status-box">누적 사망자: <span id="total-dead">0</span>명</div>
        <div class="status-box">완치자: <span id="total-recovered">0</span>명</div>
    </div>

    <canvas id="simCanvas" width="900" height="400"></canvas>
    
    <canvas id="simulationChart" style="height: 150px;"></canvas>
</div>

<script>
    const simCanvas = document.getElementById('simCanvas');
    const simCtx = simCanvas.getContext('2d');
    let chart;
    let agents = [];
    let simulationRunning = false;
    let animationFrameId;
    let timeStep = 0;
    
    // 에이전트 클래스 정의
    class Agent {
        constructor(x, y, status, speed, width, height) {
            this.x = x; this.y = y;
            this.status = status; // 'S'(감염 가능), 'I'(감염됨), 'R'(완치), 'D'(사망)
            this.radius = 5;
            this.vx = (Math.random() - 0.5) * speed;
            this.vy = (Math.random() - 0.5) * speed;
            this.width = width; this.height = height;
            this.infectionTime = 0;
        }

        // 업데이트 및 이동
        update(recoveryFrames, fatalityRate) {
            if (this.status === 'D') return; // 사망한 에이전트는 움직이지 않음

            this.x += this.vx;
            this.y += this.vy;

            // 경계 충돌 처리
            if (this.x < this.radius || this.x > this.width - this.radius) this.vx *= -1;
            if (this.y < this.radius || this.y > this.height - this.radius) this.vy *= -1;

            if (this.status === 'I') {
                this.infectionTime++;
                if (this.infectionTime >= recoveryFrames) {
                    this.resolveInfection(fatalityRate);
                }
            }
        }

        // 그리기
        draw(ctx) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            switch (this.status) {
                case 'S': ctx.fillStyle = '#3498db'; break; // 감염 가능 (파랑)
                case 'I': ctx.fillStyle = '#e74c3c'; break; // 감염됨 (빨강)
                case 'R': ctx.fillStyle = '#2ecc71'; break; // 완치 (초록)
                case 'D': ctx.fillStyle = '#333333'; break; // 사망 (검정)
            }
            ctx.fill();
            ctx.closePath();
        }

        // 완치 또는 사망 결정
        resolveInfection(fatalityRate) {
            if (Math.random() < fatalityRate) {
                this.status = 'D';
            } else {
                this.status = 'R';
            }
        }
    }

    // 시뮬레이션 초기화 및 실행
    function startSimulation() {
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        simulationRunning = true;
        timeStep = 0;
        getParams();
        initializeAgents();
        setupChart();
        runLoop();
    }

    // 사용자 입력값 가져오기
    function getParams() {
        currentParams = {
            population: parseInt(document.getElementById('total-pop').value),
            initInf: 1, // 초기 감염자 수 1명 고정
            recoveryFrames: parseInt(document.getElementById('recovery').value),
            fatalityRate: parseFloat(document.getElementById('fatality').value) / 100,
            speed: parseInt(document.getElementById('speed').value),
            infectionRadius: parseInt(document.getElementById('infection-radius').value)
        };
        // 텍스트 업데이트
        document.getElementById('val-pop').innerText = currentParams.population;
        document.getElementById('val-init-inf').innerText = currentParams.initInf;
        document.getElementById('val-recovery').innerText = currentParams.recoveryFrames;
        document.getElementById('val-fatality').innerText = (currentParams.fatalityRate * 100).toFixed(0);
        document.getElementById('val-speed').innerText = currentParams.speed;
        document.getElementById('val-infection-radius').innerText = currentParams.infectionRadius;
    }

    // 에이전트 초기화
    function initializeAgents() {
        agents = [];
        const width = simCanvas.width;
        const height = simCanvas.height;
        for (let i = 0; i < currentParams.population - 1; i++) {
            agents.push(new Agent(Math.random() * width, Math.random() * height, 'S', currentParams.speed, width, height));
        }
        // 초기 감염자 1명 추가
        agents.push(new Agent(width / 2, height / 2, 'I', currentParams.speed, width, height));
    }

    // 감염 처리
    function handleInfection() {
        for (let i = 0; i < agents.length; i++) {
            if (agents[i].status !== 'I') continue; // 감염된 에이전트만 감염시킬 수 있음
            for (let j = 0; j < agents.length; j++) {
                if (agents[j].status !== 'S') continue; // 감염 가능한 에이전트만 감염될 수 있음
                
                let dx = agents[i].x - agents[j].x;
                let dy = agents[i].y - agents[j].y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < currentParams.infectionRadius) {
                    agents[j].status = 'I'; // 감염 반경 내에 있으면 감염됨
                }
            }
        }
    }

    // 실시간 수치 업데이트
    function updateStats() {
        let stats = { S: 0, I: 0, R: 0, D: 0 };
        for (let agent of agents) {
            stats[agent.status]++;
        }
        document.getElementById('current-infected').innerText = stats.I;
        document.getElementById('total-dead').innerText = stats.D;
        document.getElementById('total-recovered').innerText = stats.R;
        return stats;
    }

    // 차트 설정
    function setupChart() {
        const chartCtx = document.getElementById('simulationChart').getContext('2d');
        if (chart) chart.destroy();
        chart = new Chart(chartCtx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: '감염 가능', data: [], borderColor: '#3498db', fill: false, pointRadius: 0 },
                    { label: '현재 감염', data: [], borderColor: '#e74c3c', fill: false, pointRadius: 0 },
                    { label: '완치', data: [], borderColor: '#2ecc71', fill: false, pointRadius: 0 },
                    { label: '사망', data: [], borderColor: '#333333', fill: false, pointRadius: 0 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { display: false },
                    y: { display: true, beginAtZero: true, min: 0, max: currentParams.population }
                },
                animation: false,
                plugins: {
                    legend: { display: false },
                    title: { display: true, text: '시간에 따른 상태 변화 추이' }
                }
            }
        });
    }

    // 차트 데이터 업데이트 (매 10프레임마다)
    function updateChart(stats) {
        if (timeStep % 10 === 0) {
            chart.data.labels.push('');
            chart.data.datasets[0].data.push(stats.S);
            chart.data.datasets[1].data.push(stats.I);
            chart.data.datasets[2].data.push(stats.R);
            chart.data.datasets[3].data.push(stats.D);
            chart.update();
        }
    }

    // 시뮬레이션 메인 루프
    function runLoop() {
        if (!simulationRunning) return;
        simCtx.clearRect(0, 0, simCanvas.width, simCanvas.height);

        handleInfection();

        for (let agent of agents) {
            agent.update(currentParams.recoveryFrames, currentParams.fatalityRate);
            agent.draw(simCtx);
        }

        let stats = updateStats();
        updateChart(stats);
        timeStep++;

        animationFrameId = requestAnimationFrame(runLoop);
    }

    // 입력값이 변경될 때마다 수치 업데이트 및 슬라이더 작동 가능하도록
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('input', getParams);
    });

    // 시작 버튼 클릭 이벤트
    document.getElementById('start-btn').addEventListener('click', startSimulation);

    // 초기 화면 실행
    startSimulation();
</script>

</body>
</html>
